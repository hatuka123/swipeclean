name: Android build

# Push to main: signed release APK -> GitHub Release -> Telegram.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".github/workflows/notify.yml"
      - ".github/workflows/verify.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.6.0"

      - name: Restore signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64" || { echo "SIGNING_KEYSTORE_BASE64 secret missing"; exit 1; }
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -o pipefail
          gradle assembleRelease -PversionCode="$BUILD_NUMBER" --stacktrace 2>&1 | tee build.log
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          cp "$APK" "SwipeClean-build-$BUILD_NUMBER.apk"

      - name: Check merged manifest (Play policy)
        run: bash .github/scripts/check-manifest.sh

      - name: Read commit message
        run: |
          {
            echo "COMMIT_MSG<<__EOF__"
            git log -1 --pretty=%B | python3 -c "import sys; print(sys.stdin.read().strip()[:700])"
            echo
            echo "__EOF__"
          } >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-$BUILD_NUMBER" "SwipeClean-build-$BUILD_NUMBER.apk" \
            --target "$GITHUB_SHA" \
            --title "Build $BUILD_NUMBER" \
            --notes "$COMMIT_MSG"

      - name: Send APK to Telegram
        run: |
          CAPTION="✅ ניקוי בהחלקה – בנייה $BUILD_NUMBER מוכנה להתקנה

          $COMMIT_MSG"
          curl -sS --fail-with-body \
            -F chat_id="$TELEGRAM_CHAT_ID" \
            -F document=@"SwipeClean-build-$BUILD_NUMBER.apk" \
            -F caption="$CAPTION" \
            "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendDocument" > /dev/null

      - name: Report failure to Telegram
        if: failure()
        run: |
          {
            echo "❌ ניקוי בהחלקה – בנייה $BUILD_NUMBER נכשלה"
            echo "$RUN_URL"
            echo
            echo "40 השורות האחרונות בלוג:"
            if [ -f build.log ]; then
              tail -n 40 build.log
            else
              echo "(הבנייה לא התחילה – השלב שנכשל הוא לפני הבנייה, ראה בקישור)"
            fi
          } | python3 -c "import sys; print(sys.stdin.read()[-3900:])" > tg_message.txt
          curl -sS \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode text@tg_message.txt \
            "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" > /dev/null
