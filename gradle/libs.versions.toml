coreKtx = "1.19.1"
coil = "3.6.3"
billing = "9.1.0"
coroutines = "1.11.0"
junit = "4.13.2"
robolectric = "4.17"
androidxTestRunner = "1.7.0"
androidxTestRules = "1.7.0"
